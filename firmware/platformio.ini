; SPDX-License-Identifier: MIT
;
; Heltec WiFi LoRa 32 V4 -- shared-radio Meshtastic + MeshCore bridge.
;
; Two things here are load-bearing and easy to get wrong:
;
;   board_build.partitions  must point at the five-slot table. Two frameworks
;                           plus three reserved ones is what lets a later
;                           framework be added without a repartition.
;   BRIDGE_REGION           defaults to EU_868, the one region where the two
;                           community defaults share a carrier. Every other
;                           region resolves to a FrequencyMismatch until the
;                           operator retunes one side on purpose.
;
; The host gate in ../Makefile is the gate. `make check` needs only a C++
; compiler; this file needs PlatformIO and, for the radio path, a vendor stack
; that is not vendored yet.

[platformio]
default_envs = heltec_v4_bridge
src_dir = .

[env:heltec_v4_bridge]
platform = espressif32@^6.9.0
board = heltec_wifi_32_lora_v4
framework = arduino

board_build.partitions = partitions/quadboot.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB

build_flags =
    -I include
    ; Region and channel plan. Override on the command line, e.g.
    ;   pio run -e heltec_v4_bridge -t upload
    ;     --project-option="build_flags=-DBRIDGE_REGION=\\\"US_915\\\""
    -D BRIDGE_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3
build_unflags =
    -std=gnu++11

; The portable logic is compiled with the same strictness as the host gate, so
; a warning that would fail CI cannot sit unnoticed in the firmware build.
; -Wconversion in particular catches the narrowing bugs that a radio struct
; invites.
build_type = debug

; The lean table, for anyone who wants the maximum room for settings and does
; not want slots held for frameworks that do not exist yet.
[env:heltec_v4_bridge_dualboot]
extends = env:heltec_v4_bridge
board_build.partitions = partitions/dualboot.csv
