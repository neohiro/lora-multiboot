; SPDX-License-Identifier: MIT
;
; Heltec WiFi LoRa 32 V4 -- shared-radio Meshtastic + MeshCore bridge.
;
; Two things here are load-bearing and easy to get wrong:
;
;   board_build.partitions  must point at the five-slot table. Two frameworks
;                           plus three reserved ones is what lets a later
;                           framework be added without a repartition.
;   BRIDGE_REGION           defaults to EU_868, the one region where the two
;                           community defaults share a carrier. Every other
;                           region resolves to a FrequencyMismatch until the
;                           operator retunes one side on purpose.
;
; The host gate in ../Makefile is the gate. `make check` needs only a C++
; compiler; this file needs PlatformIO and, for the radio path, a vendor stack
; that is not vendored yet.

[platformio]
default_envs = heltec_v4_bridge
src_dir = .
; `board` takes an id, not a path: PlatformIO looks for <boards_dir>/<id>.json and
; nothing else, and a path there fails with UnknownBoard rather than saying why.
boards_dir = .

; The V4 has no board definition upstream. The one shipped for the V3 is the same
; chip and the same SX1262 pin mapping, but declares 8 MB of flash while the V4
; carries 16 MB -- and it would stamp ARDUINO_heltec_wifi_lora_32_V3 into the
; firmware, which is the truth today but not in a year.
;
; So the board is ours: heltec_wifi_32_lora_v4.json beside this file. The variant
; stays borrowed and the file says so. The firmware is told it is a V4 through
; BOARD_HELTEC_WIFI_LORA_V4, which is a macro we invented and can keep;
; ARDUINO_heltec_wifi_lora_32_V3 selects a pins header that actually exists, and
; inventing a V4 one would be a guess about pins nobody has checked.

[env:heltec_v4_bridge]
platform = espressif32@^6.9.0
board = heltec_wifi_32_lora_v4
framework = arduino

board_build.partitions = partitions/quadboot.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB

build_flags =
    -I include
    ; Region and channel plan. Override on the command line, e.g.
    ;   pio run -e heltec_v4_bridge -t upload
    ;     --project-option="build_flags=-DBRIDGE_REGION=\\\"US_915\\\""
    -D BRIDGE_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3
    ; C++17, stated rather than inherited. The Arduino core compiles at gnu++11,
    ; and this project uses two things that do not exist there: `inline constexpr`
    ; table variables, which are C++17, and brace-initialising structs that carry
    ; default member initialisers, which is not aggregate initialisation before
    ; C++14. Both compiled under the host gate's default and were rejected only by
    ; the real toolchain, which is what this file's own CI job is for.
    -std=gnu++17
; ...and the core's own -std has to be removed for that to take effect. Adding the
; standard without unflagging is the version of this that does nothing: the core's
; flag comes later on the command line and wins.
build_unflags = -std=gnu++11

; The radio path will want the narrowing warnings the host gate already enforces:
;   -Wconversion -Wsign-conversion -Wshadow -Werror
; They are deliberately NOT set here yet, because this environment builds only
; main.cpp and the Arduino framework, not the portable modules -- which the gate
; covers with them already on. Adding them before the radio path exists would be
; claiming a strictness this build does not have.
build_type = release

; The lean table, for anyone who wants the maximum room for settings and does
; not want slots held for frameworks that do not exist yet.
[env:heltec_v4_bridge_dualboot]
extends = env:heltec_v4_bridge
board_build.partitions = partitions/dualboot.csv
