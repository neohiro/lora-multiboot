name: Firmware

# Builds the actual firmware with its actual toolchain, and validates the partition
# tables with ESP-IDF's own generator.
#
# Why this is separate from the main gate: `tools/gate.py` type-checks main.cpp
# against a hand-written Arduino shim, which is fast, needs nothing but a C++
# compiler, and runs on every push. It is also a model of the Arduino API rather
# than the Arduino API -- so it cannot catch a signature or overload that differs,
# a board id PlatformIO does not recognise, or a partition table ESP-IDF rejects.
#
# Those are exactly the failures that would otherwise be found by a user, on their
# first flash, with a board in their hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  partitions:
    name: ESP-IDF partition validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ESP-IDF's own generator, fetched from a pinned release rather than from
      # master, and from master rather than from esptool -- esptool 5.x no longer
      # carries the command at all, which is why an earlier version of this file
      # failed on a flag that never existed. Pinned so that an upstream release
      # cannot turn this job red for a reason that has nothing to do with us;
      # bump it deliberately. This release is standard library only, so it runs on
      # a bare runner with nothing installed.
      - name: Fetch ESP-IDF's partition generator
        run: |
          set -euo pipefail
          curl -sSfLo gen_esp32part.py \
            https://raw.githubusercontent.com/espressif/esp-idf/v5.3.2/components/partition_table/gen_esp32part.py
          echo "gen_esp32part.py: $(wc -c < gen_esp32part.py) bytes"
          python -c "import ast,sys; ast.parse(open('gen_esp32part.py').read())"
          echo "parses as python"

      - name: Generate the partition table the way ESP-IDF does
        run: |
          set -euo pipefail
          mkdir -p out
          for table in firmware/partitions/*.csv; do
            name=$(basename "$table" .csv)
            echo "== $name"
            # This is the third party that gets to say no: our own parser in
            # flash.py, the rules in the host gate, and now the generator the real
            # ESP-IDF build uses. It caught two shipped tables that were invalid.
            python gen_esp32part.py "$table" "out/$name.bin"
            echo "   ok -> out/$name.bin ($(stat -c%s "out/$name.bin") bytes)"
          done

      - name: Show what ESP-IDF made of each table
        run: |
          set -euo pipefail
          for bin in out/*.bin; do
            echo "== $bin"
            python gen_esp32part.py "$bin"
          done

      # The table the bootloader reads has to be the table we validated. If the
      # generator had to pad or truncate, the file on the device is not the file
      # that was checked, and the size check below is the only place that shows.
      - name: The binary is a whole number of sectors and fits one sector
        run: |
          set -euo pipefail
          for bin in out/*.bin; do
            size=$(stat -c%s "$bin")
            echo "$bin: $size bytes"
            if [ "$size" -gt 4096 ]; then
              echo "::error::$bin exceeds one 4 KB sector; the bootloader would truncate it"
              exit 1
            fi
            if [ $((size % 32)) -ne 0 ]; then
              echo "::error::$bin is not MD5-aligned"
              exit 1
            fi
          done

  firmware:
    name: PlatformIO build (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env: [heltec_v4_bridge, heltec_v4_bridge_dualboot]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache the ESP32 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --quiet platformio

      # The build log is kept, not just the exit code. A warning in a firmware
      # build is the only place a pin that is about to be driven is ever mentioned,
      # and grepping the build tree afterwards would find nothing but strings in
      # object files.
      - name: Build
        run: |
          set -o pipefail
          pio run -d firmware -e ${{ matrix.env }} 2>&1 | tee build.log

      - name: No compiler diagnostics
        run: |
          set -euo pipefail
          if grep -nE '(warning|error):' build.log; then
            echo "::error::compiler diagnostics in the build"
            exit 1
          fi
          echo "clean build, no warnings"

      # The shim that lets the fast gate type-check main.cpp is a model of Arduino,
      # so a green shim check is not proof the real build links. Report the image
      # size against the slot it has to fit in, because "too big for its partition"
      # is otherwise discovered by the bootloader refusing to run it. The slot size
      # is read from the table that was just built rather than written here, so the
      # two cannot drift apart.
      - name: Image fits its slot
        run: |
          set -euo pipefail
          case "${{ matrix.env }}" in
            heltec_v4_bridge)         table=quadboot.csv ;;
            heltec_v4_bridge_dualboot) table=dualboot.csv ;;
            *) echo "::error::unknown env"; exit 1 ;;
          esac
          slot_bytes=$(python -c "
          import csv
          rows = list(csv.reader(open('firmware/partitions/$table')))
          sizes = [int(r[4].strip().rstrip(), 0) for r in rows if r and r[0].strip().startswith('ota_')]
          assert sizes, 'no ota_ rows'
          print(min(sizes))
          ")
          bin=firmware/.pio/build/${{ matrix.env }}/firmware.bin
          if [ ! -f "$bin" ]; then
            echo "::error::no firmware.bin produced"
            ls -R "firmware/.pio/build/${{ matrix.env }}" | head -50
            exit 1
          fi
          size=$(stat -c%s "$bin")
          echo "firmware.bin: $size bytes; slot: $slot_bytes bytes ($table)"
          if [ "$size" -gt "$slot_bytes" ]; then
            echo "::error::image does not fit its slot"
            exit 1
          fi
          echo "fits, with $((slot_bytes - size)) bytes spare"