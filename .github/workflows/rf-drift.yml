name: RF drift

# Watches the one external fact this whole project depends on: that Meshtastic and
# MeshCore share a carrier, so a single SX1262 can serve both.
#
# That is true today and neither project is ours. If it stops being true the
# architecture does not degrade politely -- it becomes one mesh plus noise while
# still looking healthy, which is the failure mode nobody catches until a node is
# on a mast.
#
# What happens on drift:
#   - the newly observed values are recorded in firmware/rf_defaults.json
#   - VERSION is bumped in the same commit as the recording, so a version can
#     never claim to contain a value that is not in the same tree
#   - a pull request is opened describing exactly which value moved
#
# A tag is NOT cut here. The version becomes real when the pull request merges,
# and `release.yml` tags `main` at that point -- a tag made here would point at a
# commit nobody has reviewed and that is not on `main`.
#
# "Undeterminable" is deliberately not treated as success. If a source cannot be
# reached or parsed, that is raised as an issue rather than reported as an
# all-clear, because a monitor that shrugs when it cannot see is worse than no
# monitor at all.

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Deliberately not on the hour: the point of an odd
    # minute is to avoid the thundering herd every scheduler on the internet has.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      write:
        description: "Record newly observed upstream values into rf_defaults.json"
        type: boolean
        default: true

permissions:
  contents: write   # tag the new version
  pull-requests: write

concurrency:
  group: rf-drift
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream RF defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.run.outputs.result }}
      report: ${{ steps.run.outputs.report }}

    steps:
      - uses: actions/checkout@v4

      - name: Check
        id: run
        run: |
          set +e
          # Always run with --write. Recording the observation is not the same act
          # as releasing it: the recording happens on a branch in the next job and
          # only becomes main through a reviewed pull request. An earlier version
          # of this file ran without --write on schedule and could not have
          # detected the very case it exists for.
          python3 tools/rf_drift.py --write > drift.txt 2>&1
          code=$?
          set -e
          cat drift.txt
          case "$code" in
            0) echo "result=ok"      >> "$GITHUB_OUTPUT" ;;
            3) echo "result=drift"    >> "$GITHUB_OUTPUT" ;;
            4) echo "result=unknown"  >> "$GITHUB_OUTPUT" ;;
            *) echo "result=error"    >> "$GITHUB_OUTPUT"; echo "unexpected exit $code"; exit 1 ;;
          esac
          {
            echo 'report<<EOF'
            cat drift.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # The values that would be recorded, kept as an artefact so a run that
      # reports "drift" can be inspected without reproducing it.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf-drift-report
          path: drift.txt
          retention-days: 30

      # The local half, which needs no network at all and must never drift out of
      # step with what the firmware actually compiles.
      - name: Offline cross-check
        run: python3 tools/rf_drift.py --offline

  version:
    name: Propose a version
    needs: check
    if: needs.check.outputs.result == 'drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A plain git branch rather than create-pull-request. The point of the branch
      # is that the recorded values and the version bump travel together, so this
      # job has to produce both commits itself; a helper action that makes its own
      # branch from a clean tree is one more thing between the observation and the
      # file that records it.
      - name: Record the observation and bump the version
        id: change
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 tools/rf_drift.py --write | tee drift.txt

          old=$(cat VERSION)
          major=${old%%.*}
          rest=${old#*.}; minor=${rest%%.*}
          patch=${old##*.}; patch=${patch%%.*}
          # A minor bump, not a patch: an upstream band limit moving is a change to
          # what this firmware is allowed to do, not a fix to what it does.
          new="$major.$((minor+1)).0"
          printf '%s\n' "$new" > VERSION

          if git diff --quiet -- firmware/rf_defaults.json VERSION; then
            echo "::error::drift was reported but nothing changed to record"
            exit 1
          fi

          git add firmware/rf_defaults.json VERSION
          git commit -q -m "RF defaults moved upstream: v$new"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "$old -> $new"
          git --no-pager diff --stat HEAD~1

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="rf-drift/${{ github.run_number }}"
          git push -u origin "HEAD:$branch"

          # One open drift PR at a time. A second would be a second untested
          # version claim against the same upstream, and whichever merged second
          # would silently revert whichever fields the first had already recorded.
          existing=$(gh pr list --state open --limit 100 --json headRefName \
                       --jq "[.[].headRefName | select(startswith(\"rf-drift/\"))] | length")
          if [ "$existing" -gt 0 ]; then
            echo "::error::an rf-drift pull request is already open; close it first"
            exit 1
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "RF defaults moved upstream (v${{ steps.change.outputs.new }})" \
            --body "$(printf '%s\n' \
              'Upstream radio defaults changed. This pull request records the newly' \
              'observed values and cuts **v${{ steps.change.outputs.new }}**' \
              '(was v${{ steps.change.outputs.old }}).' \
              '' \
              '```' \
              '${{ needs.check.outputs.report }}' \
              '```' \
              '' \
              '### What this means' \
              '' \
              'The shared-carrier premise is what lets one SX1262 serve both meshes.' \
              'Check the report above for whether it still holds:' \
              '' \
              '- **Band limits or duty cycle changed** -- `ChannelPlan.cpp` may need' \
              '  retuning, and the airtime cap must be re-checked against the new limit.' \
              '- **Only a regions power limit changed** -- `RadioPlan.cpp` may reject a' \
              '  power level that is now illegal.' \
              '- **A carrier moved** -- the affected region no longer has a shared' \
              '  carrier and `resolvePlan()` will report `FrequencyMismatch`.' \
              '' \
              '### What this pull request deliberately does not do' \
              '' \
              'It records what upstream says. It does **not** retune anything: the' \
              'table in `ChannelPlan.cpp` is changed deliberately, by a human, with' \
              '`make check` proving the result. The version bump travels in the same' \
              'commit as the recorded values so a tag cannot claim to contain a' \
              'number that is not in the tree it points at.' \
              '' \
              'Merging this is what releases the version: `release.yml` tags `main`.' \
              '' \
              '<!-- drift-report:' \
              '${{ needs.check.outputs.report }}' \
              '-->')"

      - name: Update the report issue if this is a repeat
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'RF drift could not be turned into a pull request',
              body: ['Upstream RF defaults moved, but the pull request step failed.',
                     '',
                     '```',
                     '${{ needs.check.outputs.report }}',
                     '```'].join('\n'),
            });

  report:
    name: Raise an issue when the check cannot see
    needs: check
    if: needs.check.outputs.result == 'unknown' || needs.check.outputs.result == 'error'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain
        uses: actions/github-script@v7
        with:
          script: |
            // Comment on the open issue rather than opening a new one every week.
            // A monitor that files a fresh issue each run trains everyone to
            // ignore it, and the one week it matters is the week nobody reads it.
            const title = 'RF drift monitor cannot read an upstream source';
            const body = [
              'The RF drift monitor could not read one of its upstream sources.',
              '',
              'It is reporting "undeterminable" rather than "no drift" on purpose:',
              'a monitor that reports agreement it did not verify is worse than one',
              'that admits ignorance. This project depends on Meshtastic and',
              'MeshCore continuing to share a carrier, so a silent monitor is a real',
              'risk rather than a missing nicety.',
              '',
              '```',
              '${{ needs.check.outputs.report }}',
              '```',
              '',
              'Likely one of:',
              '',
              '- the source URL moved or the file was renamed',
              '- the upstream file was restructured, so the parser needs updating',
              '- a transient network failure',
              '',
              'The parser that needs attention is in `tools/rf_drift.py`, and',
              '`tests/test_rf_drift.py` covers its behaviour offline.',
              '',
              `_Checked ${new Date().toISOString()}._`,
            ].join('\n');

            const found = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rf-drift',
            });
            if (found.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.data[0].number,
                body,
              });
              core.info(`commented on #${found.data[0].number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['rf-drift'],
            });
            core.info(`opened #${created.data.number}`);